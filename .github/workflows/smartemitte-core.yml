name: SmartEmitte core verification
on:
  pull_request:
    paths:
      - 'packages/core/**'
      - 'apps/api/**'
      - '.github/workflows/smartemitte-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core tests
        run: npm test
      - name: Build core and API
        run: npm run build
      - name: API typecheck
        run: npm run -w apps/api typecheck